<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alkebulan</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  #visitor-box {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 10;
  padding: 8px 14px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.65);
  color: white;
  font: 14px Arial, Helvetica, sans-serif;
  letter-spacing: 0.04em;
  backdrop-filter: blur(4px);
}
  </style>
</head>
<body>
  <img src="assets/earth.webp"
       alt="Planet Earth centered on Africa, Europe, and western Asia against space">
<div id="visitor-box">
  Visitors: <span id="visitor-count">Loading…</span>
</div>

<script
  data-goatcounter="https://alkebulan.goatcounter.com/count"
  src="https://gc.zgo.at/count.js">
</script>

<script>
  fetch("https://alkebulan.goatcounter.com/counter/TOTAL.json")
    .then(function (response) {
      if (!response.ok) {
        throw new Error("Counter unavailable");
      }
      return response.json();
    })
    .then(function (data) {
      document.getElementById("visitor-count").textContent = data.count;
    })
    .catch(function () {
      document.getElementById("visitor-count").textContent = "—";
    });
</script>
</body>
</html>
